<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EduTrack - Suivi Scolaire</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232563eb'/%3E%3Cpath d='M18 18h28v6H18zm0 11h28v6H18zm0 11h18v6H18z' fill='white'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav class="navbar">
      <div class="container nav-content">
        <div>
          <p class="eyebrow">Suivi scolaire</p>
          <h1>EduTrack</h1>
        </div>
        <span>Système de suivi global</span>
      </div>
    </nav>

    <main class="container grid-layout">
      <section class="card">
        <div class="card-header">
          <div>
            <p class="section-label">Présence</p>
            <h2>Note de Présence</h2>
          </div>
        </div>
        <div class="form-group">
          <label for="eleve-presence">Sélectionner un élève</label>
          <select id="eleve-presence"></select>
        </div>
        <div class="form-group">
          <label>Statut</label>
          <div class="radio-group">
            <label
              ><input type="radio" name="statut" value="P" checked /> Présent
              (P)</label
            >
            <label
              ><input type="radio" name="statut" value="A" /> Absent (A)</label
            >
            <label
              ><input type="radio" name="statut" value="R" /> Retard (R)</label
            >
          </div>
        </div>
        <button id="btn-presence" class="btn btn-primary">
          Enregistrer la présence
        </button>
      </section>

      <section class="card">
        <div class="card-header">
          <div>
            <p class="section-label">Évaluation</p>
            <h2>Saisie des Notes</h2>
          </div>
        </div>
        <div class="form-group">
          <label for="eleve-note">Sélectionner un élève</label>
          <select id="eleve-note"></select>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="type-note">Type :</label>
            <select id="type-note">
              <option value="Interro">Interrogation</option>
              <option value="Examen">Examen</option>
            </select>
          </div>
          <div class="form-group">
            <label for="valeur-note">Cote (sur 20) :</label>
            <input type="number" id="valeur-note" min="0" max="20" />
          </div>
        </div>
        <button id="btn-note" class="btn btn-success">
          Calculer & Enregistrer
        </button>
      </section>

      <section class="card full-width">
        <div class="card-header">
          <div>
            <p class="section-label">Synthèse</p>
            <h2>Analyse Globale de l'Élève</h2>
          </div>
        </div>
        <div class="table-responsive">
          <table>
            <thead>
              <tr>
                <th>Nom</th>
                <th>Taux de Présence</th>
                <th>Moyenne</th>
                <th>Statut Général</th>
              </tr>
            </thead>
            <tbody id="tableau-analyse"></tbody>
          </table>
        </div>
      </section>
    </main>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
